[[faq]]
  q = "How long does a migration take?"
  a = "It depends on the complexity of the operation. Mid-size projects typically take 6 to 12 weeks. Larger projects with multiple integrations can take 3 to 6 months. The initial discovery defines this more precisely."
[[faq]]
  q = "Does the store go down during migration?"
  a = "No. The current operation continues running normally throughout the project. The cutover is planned in a controlled window — typically a few hours during low traffic."
[[faq]]
  q = "Is order history and customer data migrated?"
  a = "Yes, for the most part. Products, categories, customers and order history are migrated in most projects. Data specific to legacy platforms is evaluated case by case."
[[faq]]
  q = "Is SEO affected by the migration?"
  a = "When well planned, migration doesn't cause meaningful organic traffic loss. This includes URL mapping, redirects, metadata migration and post-go-live monitoring. SEO is treated as a requirement, not an optional item."

