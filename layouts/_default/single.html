{{ define "main" }}
<div class="page-single">
  <div class="page-single__header section">
    <div class="container">
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p class="page-single__lead">{{ . }}</p>{{ end }}
    </div>
  </div>
  <div class="page-single__body section">
    <div class="container">
      <div class="prose">
        {{ .Content }}
      </div>
    </div>
  </div>
</div>
{{ end }}
